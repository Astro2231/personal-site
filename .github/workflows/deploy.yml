# The real site is hosted on Cloudflare at https://benpaldy.dev. GitHub Pages
# now only publishes a redirect page, so old astro2231.github.io/personal-site/
# links forward to the same page on benpaldy.dev.
name: Deploy redirect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect site
        run: |
          mkdir -p _redirect
          cp .github/pages-redirect/index.html _redirect/index.html
          cp .github/pages-redirect/index.html _redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
